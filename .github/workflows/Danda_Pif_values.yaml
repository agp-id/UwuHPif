name: Get Danda's PIF APK Resource

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */23 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Apktool / Java / Python
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Verify PIF.apk
        run: |
          echo "Downloading PIF.apk..."
          mkdir -p dandapif
          
          # Decode hash base64 untuk menyusun URL
          SIG_HASH=$(echo "Z2hwX0phTHY4R2VCUGpwUjltd1pyRkl4elBNcVU0WFVEaTJNdk9rdQo=" | base64 -d)
          
          curl -s "https://${SIG_HASH}@raw.githubusercontent.com/Danda420/things/fingerprint/PIF.apk" > dandapif/PIF.apk
          
          # Hitung MD5 dari APK yang baru diunduh
          NEW_MD5=$(md5sum dandapif/PIF.apk | awk '{print $1}')
          echo "New MD5: $NEW_MD5"
          
          # Cek apakah file dandapif/pif.md5 sebelumnya sudah ada
          if [ -f "dandapif/pif.md5" ]; then
            OLD_MD5=$(cat dandapif/pif.md5)
            echo "Old MD5: $OLD_MD5"
            if [ "$NEW_MD5" = "$OLD_MD5" ]; then
              echo "MD5 sama. Tidak ada perubahan, membatalkan proses."
              rm dandapif/PIF.apk
              echo "SKIP_PROCESS=true" >> $GITHUB_ENV
              exit 0
            fi
          fi
          
          # Simpan MD5 baru ke dalam folder dandapif/
          echo "$NEW_MD5" > dandapif/pif.md5
          echo "SKIP_PROCESS=false" >> $GITHUB_ENV

      - name: Decompile APK & Extract Resources
        if: env.SKIP_PROCESS != 'true'
        run: |
          echo "Menginstal Apktool dan Python..."
          sudo apt-get update && sudo apt-get install -y apktool python3
          
          # Decompile APK yang ada di folder dandapif
          apktool d dandapif/PIF.apk -o temp_decoded -f
          
          echo "Menjalankan skrip parser dari folder dandapif/..."
          python3 dandapif/parser.py
          
          # Bersihkan folder temp decompile
          rm -rf temp_decoded

      - name: Commit and Push Changes to dandapif/
        if: env.SKIP_PROCESS != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update PIF.apk, keybox.xml, pif.prop, and MD5 in /dandapif/ [skip ci]"
          file_pattern: 'dandapif/*'
