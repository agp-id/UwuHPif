name: Get Danda's PIF APK Resource

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */23 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download and Verify MD5
        run: |
          echo "Downloading PIF.apk..."
          mkdir -p danda_pif
          
          if [ ! -f "danda_pif/key" ]; then
            echo "Error: File danda_pif/key tidak ditemukan!"
            exit 1
          fi
          
          ENCRYPTED_HASH=$(cat danda_pif/key | tr -d '\n' | tr -d '\r')
          SIG_HASH=$(echo "$ENCRYPTED_HASH" | base64 -d)
          
          curl -s "https://${SIG_HASH}@raw.githubusercontent.com/Danda420/things/fingerprint/PIF.apk" > danda_pif/PIF.apk
          
          NEW_MD5=$(md5sum danda_pif/PIF.apk | awk '{print $1}')
          echo "New MD5: $NEW_MD5"
          echo "NEW_MD5=$NEW_MD5" >> $GITHUB_ENV
          
          if [ -f "danda_pif/pif.md5" ]; then
            OLD_MD5=$(cat danda_pif/pif.md5)
            echo "Old MD5: $OLD_MD5"
            if [ "$NEW_MD5" = "$OLD_MD5" ]; then
              echo "MD5 sama. Tidak ada perubahan, membatalkan proses."
              rm danda_pif/PIF.apk
              echo "SKIP_PROCESS=true" >> $GITHUB_ENV
              exit 0
            fi
          fi
          
          echo "SKIP_PROCESS=false" >> $GITHUB_ENV

      - name: Setup Apktool and Python Tools
        if: env.SKIP_PROCESS != 'true'
        run: |
          echo "Menyiapkan Apktool resmi..."
          # Download apktool.jar versi stabil langsung dari repository rilis iBotPeaches
          sudo curl -L -o /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          
          echo "Memastikan Python3 tersedia..."
          sudo apt-get update && sudo apt-get install -y python3


      - name: Decompile APK & Extract Resources
        if: env.SKIP_PROCESS != 'true'
        run: |
          echo "Menjalankan proses decompile APK via jar..."
          java -jar /usr/local/bin/apktool.jar d danda_pif/PIF.apk -o temp_decoded -f
          
          echo "Menjalankan skrip parser dari dalam folder danda_pif/..."
          cd danda_pif
          python3 parser.py
          PARSER_EXIT_CODE=$?
          cd ..
          
          rm -rf temp_decoded
          
          if [ $PARSER_EXIT_CODE -eq 0 ]; then
            echo "${{ env.NEW_MD5 }}" > danda_pif/pif.md5
            echo "Parsing sukses. MD5 diperbarui."
          else
            echo "Parsing gagal! MD5 tidak akan diubah."
            exit 1
          fi

      - name: Commit and Push Changes to dandapif/
        if: env.SKIP_PROCESS != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update PIF.apk, keybox.xml, pif.prop, and MD5 in /danda_pif/ [skip ci]"
          file_pattern: 'danda_pif/*'
