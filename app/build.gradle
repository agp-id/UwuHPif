plugins {
    id 'com.android.application'
}

android {
    namespace 'com.uwuh.pif'
    compileSdk 34

    defaultConfig {
        applicationId "com.uwuh.pif"
        minSdk 26
        targetSdk 34
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

