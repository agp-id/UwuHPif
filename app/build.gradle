plugins {
    id 'com.android.application'
}

android {
    namespace 'com.uwuh.utils'
    compileSdk 35

    defaultConfig {
        applicationId "com.uwuh.utils"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Mengatur Nama Aplikasi langsung di Gradle
        resValue "string", "app_name", "UwuH"
    }

    buildTypes {
        release {
            // AKTIFKAN OBFUSCATION & PENGECILAN UKURAN APK
            minifyEnabled true
            shrinkResources true
            debuggable false

            // Aturan pengacakan kode
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Mengabaikan metadata yang tidak diperlukan untuk memperkecil ukuran
    packagingOptions {
        resources {
            excludes += [
                'META-INF/*.version',
                'META-INF/*.kotlin_module'
            ]
        }
    }
}

dependencies {
    // Kosong - Murni memakai framework bawaan ROM
    // JSON parsing pakai org.json (sudah ada di Android)
}
