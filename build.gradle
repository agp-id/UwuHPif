// build.gradle (Root)
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

// JANGAN GUNAKAN allprojects { repositories { ... } } DI SINI

task clean(type: Delete) {
    delete rootProject.buildDir
}
